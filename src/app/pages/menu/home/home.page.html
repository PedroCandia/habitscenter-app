<ion-content class="ion-padding">
  <div style="display: flex; align-items: center; justify-content: space-between; width: 100%; height: fit-content;">
    <div style="display: flex; align-items: center;">
      <ion-text style="color: white; font-size: 1.5rem;">{{now}}</ion-text>
      <ion-text style="color: rgb(219, 219, 219); font-size: 1rem; display: flex; justify-content: center; align-items: center;">
        <ion-icon name="flame-outline" style="padding-right: 0.2rem;"></ion-icon> {{streak}} días
      </ion-text>
      <!-- <ion-avatar style="width: 35px; height: 35px; margin-left: 0.5rem;"> -->
        <!-- <img alt="Foto de perfil de google" src="{{authSvc.getUserImageUrl()}}" /> -->
        <!-- <img alt="Foto de perfil de google" src="../../../../assets/img/login/icon.png" /> -->
      <!-- </ion-avatar> -->
      <!-- <ion-title>{{authSvc.getUserName() || 'UserName'}}</ion-title> -->
      <!-- <ion-title>{{'Pedro Candia'}}</ion-title> -->
    </div>

    <div style="display: flex; align-items: center;">
      <!-- <ion-text (click)="openModalVIP()" slot="end" style="padding-right: .3rem; color: var(--ion-color-dark);">{{ vip ? '∞' : currentRubys }}</ion-text>
      <img (click)="openModalVIP()" slot="end" [src]="vip ? '../../../../assets/img/home/ruby_vip.png' : '../../../../assets/img/home/ruby_free.png'" style="width: 35px; height: 35px;" />
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons> -->

      <ion-icon
        name="add-circle-outline"
        slot="end"
        style="font-size: 2rem;"
        (click)="openComponent()"></ion-icon>
    </div>
  </div>

  <ion-list lines="none">
    <div *ngFor="let habit of habits" style="display: flex; align-items: center; margin-bottom: 0.5rem;">
      <!-- Círculo para hacer check -->
      <ion-checkbox (click)="toggleCheck(habit)" [(ngModel)]="habit.checked" style="margin-right: 0.5rem;"></ion-checkbox>
  
      <!-- ion-item contenido -->
      <ion-item style="color: white; margin: 0; width: 100%;" [style.--background]="habit.color">
        <ion-icon [name]="habit.icon" style="margin-right: 10px; font-size: 24px;"></ion-icon>
        <ion-label>{{ habit.name }}</ion-label>
      </ion-item>
    </div>
  </ion-list>
  

  <!-- <ion-list lines="none">
    <ion-item *ngFor="let habit of habits" style="color: white;">
