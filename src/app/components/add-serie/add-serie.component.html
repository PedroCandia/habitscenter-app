<ion-content class="ion-padding" fullscreen>
  <ion-icon name="arrow-back-outline" (click)="goBack()" style="font-size: 1.5rem; position: absolute; top: 1rem; left: 1rem;"></ion-icon>

  <div class="center-container">
    <ion-input
      type="number"
      placeholder="0"
      [(ngModel)]="flexiones"
      inputmode="numeric"
      class="centered-input">
    </ion-input>

    <ion-button expand="block" class="custom-button" (click)="registerFlexiones()">
      Aceptar
    </ion-button>
  </div>
</ion-content>
