<ion-content class="ion-padding">
  <div class="header">
    <ion-icon name="close-outline" (click)="goBack()"></ion-icon>
  </div>

  <!-- Formulario de hábitos con inputs nativos -->
  <div style="padding: 16px;">
    <div style="margin-bottom: 16px;">
      <label for="habitName" style="color: white; display: block; margin-bottom: 8px;">Nombre de hábito</label>
      <input id="habitName" type="text" maxlength="30" placeholder="Nombre de hábito" 
             [(ngModel)]="habitName" 
             style="background: transparent; color: white; border: none; border-bottom: 1px solid white; width: 100%; padding: 8px;">
      <small style="color: white;">Máximo 30 caracteres</small>
    </div>    

    <!-- Selector de color -->
    <div style="display: flex; justify-content: space-between; align-items: center;" (click)="setModalOpen(true)">
      <span style="color: white;">Selecciona un color</span>
      <div
        [ngStyle]="{
          'background-color': selectedColor || 'transparent',
          'border': selectedColor ? 'none' : '2px solid white'
        }" 
        style="width: 40px; height: 40px; border-radius: 50%;">
      </div>
    </div>

    <!-- Selector de icono -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px;" (click)="setIconModalOpen(true)">
      <span style="color: white;">Selecciona un icono</span>
      <div style="color: white; font-size: 24px;">
        <ion-icon [name]="selectedIcon || 'help-outline'"></ion-icon>
      </div>
    </div>
  </div>

  <!-- Botón de guardar fijo abajo -->
  <div style="position: fixed; bottom: 16px; left: 0; right: 0; padding: 0 16px;">
    <ion-button expand="block" shape="round" (click)="saveHabit()" class="btn">
      Guardar
    </ion-button>
  </div>

  <ion-modal [initialBreakpoint]="0.5" [breakpoints]="[0, 0.25, 0.5, 0.75]" [isOpen]="isModalOpen"
    (willDismiss)="setModalOpen(false)">
    <ng-template>
      <ion-content class="ion-padding">
        <ion-grid>
          <ion-row>
            <ion-col size="4" (click)="selectColor('#ff0000');">
              <div style="background-color: #ff0000; width: 40px; height: 40px; border-radius: 50%;"></div>
            </ion-col>
            <ion-col size="4" (click)="selectColor('#00ff00');">
              <div style="background-color: #00ff00; width: 40px; height: 40px; border-radius: 50%;"></div>
            </ion-col>
            <ion-col size="4" (click)="selectColor('#0000ff');">
              <div style="background-color: #0000ff; width: 40px; height: 40px; border-radius: 50%;"></div>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col size="4" (click)="selectColor('#ff00ff');">
              <div style="background-color: #ff00ff; width: 40px; height: 40px; border-radius: 50%;"></div>
            </ion-col>
            <ion-col size="4" (click)="selectColor('#ffff00');">
              <div style="background-color: #ffff00; width: 40px; height: 40px; border-radius: 50%;"></div>
            </ion-col>
            <ion-col size="4" (click)="selectColor('#000000');">
              <div style="background-color: #000000; width: 40px; height: 40px; border-radius: 50%;"></div>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-content>
    </ng-template>
  </ion-modal>

  <!-- Modal para selección de iconos -->
  <ion-modal [initialBreakpoint]="0.5" [breakpoints]="[0, 0.25, 0.5, 0.75]" [isOpen]="isIconModalOpen"
    (willDismiss)="setIconModalOpen(false)">
    <ng-template>
      <ion-content class="ion-padding">
        <ion-grid>
          <ion-row>
            <ion-col size="4" (click)="selectIcon('fitness-outline');">
              <ion-icon name="fitness-outline" style="font-size: 32px; color: white;"></ion-icon>
            </ion-col>
            <ion-col size="4" (click)="selectIcon('book-outline');">
              <ion-icon name="book-outline" style="font-size: 32px; color: white;"></ion-icon>
            </ion-col>
            <ion-col size="4" (click)="selectIcon('timer-outline');">
              <ion-icon name="timer-outline" style="font-size: 32px; color: white;"></ion-icon>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col size="4" (click)="selectIcon('heart-outline');">
              <ion-icon name="heart-outline" style="font-size: 32px; color: white;"></ion-icon>
            </ion-col>
            <ion-col size="4" (click)="selectIcon('musical-notes-outline');">
              <ion-icon name="musical-notes-outline" style="font-size: 32px; color: white;"></ion-icon>
            </ion-col>
            <ion-col size="4" (click)="selectIcon('flame-outline');">
              <ion-icon name="flame-outline" style="font-size: 32px; color: white;"></ion-icon>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
