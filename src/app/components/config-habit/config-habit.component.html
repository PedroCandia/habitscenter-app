<ion-content class="ion-padding">
  <div class="header">
    <ion-icon name="close-outline" (click)="goBack()"></ion-icon>
  </div>

  <!-- Formulario de hábitos con inputs nativos -->
  <div style="padding: 16px;">
    <div class="margin-bottom">
      <label for="habitName" style="color: white; display: block; margin-bottom: 8px;">Nombre de hábito</label>
      <input id="habitName" type="text" maxlength="30" placeholder="Nombre de hábito" 
             [(ngModel)]="habitName" 
             style="background: transparent; color: white; border: none; border-bottom: 1px solid white; width: 100%; padding: 8px;">
      <small style="color: white;">Máximo 30 caracteres</small>
    </div>    

    <!-- Selector de color -->
    <div style="display: flex; justify-content: space-between; align-items: center;" (click)="setModalOpen(true)">
      <span style="color: white;">Selecciona un color</span>
      <div
        [ngStyle]="{
          'background-color': selectedColor || 'transparent',
          'border': selectedColor ? 'none' : '2px solid white'
        }" 
        style="width: 35px; height: 35px; border-radius: 50%;">
      </div>
    </div>

    <!-- Selector de icono -->
    <div class="margin-bottom" style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px;" (click)="setIconModalOpen(true)">
      <span style="color: white;">Selecciona un icono</span>
      <div style="color: white; font-size: 24px; width: 35px; display: flex; justify-content: center; align-items: center;">
        <ion-icon [name]="selectedIcon || 'add-outline'"></ion-icon>
      </div>
    </div>

    @if(errorMsg) {
      <div class="errorMsg" style="font-size: 0.8rem;">
        <ion-text>Debe ingresar al menos un nombre o ícono.</ion-text>
      </div>
    }
  </div>

  <!-- Botón de guardar fijo abajo -->
  <div style="position: fixed; bottom: 16px; left: 0; right: 0; padding: 0 16px;">
    <ion-button expand="block" shape="round" (click)="saveHabit()" class="btn">
      Guardar
    </ion-button>
  </div>

  <ion-modal [initialBreakpoint]="0.5" [breakpoints]="[0, 0.25, 0.5, 0.75, 1]" [isOpen]="isModalOpen"
    (willDismiss)="setModalOpen(false)">
    <ng-template>
      <ion-content class="ion-padding">
        <ion-grid>
          <ion-row>
            <ion-col size="4" (click)="selectColor('#ff0000');">
              <div style="background-color: #ff0000; width: 50px; height: 50px; border-radius: 50%;"></div>
            </ion-col>
            <ion-col size="4" (click)="selectColor('#00ff00');">
              <div style="background-color: #00ff00; width: 50px; height: 50px; border-radius: 50%;"></div>
            </ion-col>
            <ion-col size="4" (click)="selectColor('#0000ff');">
              <div style="background-color: #0000ff; width: 50px; height: 50px; border-radius: 50%;"></div>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col size="4" (click)="selectColor('#ff00ff');">
              <div style="background-color: #ff00ff; width: 50px; height: 50px; border-radius: 50%;"></div>
            </ion-col>
            <ion-col size="4" (click)="selectColor('#ffff00');">
              <div style="background-color: #ffff00; width: 50px; height: 50px; border-radius: 50%;"></div>
            </ion-col>
            <ion-col size="4" (click)="selectColor('#222222');">
              <div style="background-color: #222222; width: 50px; height: 50px; border-radius: 50%;"></div>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-content>
    </ng-template>
  </ion-modal>

  <!-- Modal para selección de iconos -->
  <ion-modal [initialBreakpoint]="0.5" [breakpoints]="[0, 0.25, 0.5, 0.75, 1]" [isOpen]="isIconModalOpen"
    (willDismiss)="setIconModalOpen(false)">
    <ng-template>
      <ion-content class="ion-padding">
        <ion-grid>
          <ion-row>
            @for(icon of iconList; track $index) {
              <ion-col size="4" (click)="selectIcon(icon);" class="margin-bottom">
                <ion-icon [name]="icon" style="font-size: 32px; color: white;"></ion-icon>
              </ion-col>
            }
          </ion-row>
        </ion-grid>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
